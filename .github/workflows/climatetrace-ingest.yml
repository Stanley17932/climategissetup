name: Climate TRACE daily ingest

on:
  schedule:
    # Asked for 00:23 UTC, not 06:00: GitHub queues scheduled runs and this repo
    # sees a median +5.7h delay, so 06:00 would land late afternoon EAT. The
    # minute is not 0 because the scheduler is busiest on the hour. See the
    # Schedule section of the README before changing this.
    - cron: '23 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write          # required for OIDC login to Azure

concurrency:
  group: climatetrace-ingest
  cancel-in-progress: false

env:
  STORAGE_ACCOUNT: databrickssetup
  STORAGE_RG: DefaultResourceGroup-CCAN
  SQL_SERVER: stan-devsql
  SQL_DATABASE: free-sql-db-9295428

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # warehouse.py talks to Azure SQL through pyodbc, which needs the driver
      # itself - it is a Microsoft apt package, not a pip one.
      - name: Install ODBC Driver 18 for SQL Server
        run: |
          set -euo pipefail
          if odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            echo "ODBC Driver 18 already installed"
            exit 0
          fi

          OS_VER=$(. /etc/os-release && echo "$VERSION_ID")
          # --batch is required: there is no TTY, and gpg otherwise fails trying
          # to open /dev/tty while importing the signing key.
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${OS_VER}/prod.list" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc
          odbcinst -q -d -n "ODBC Driver 18 for SQL Server"

      # No stored secret for storage: this identity is granted blob access to
      # the `landing` container by its role assignment.
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Both the storage account and the SQL server deny by default; GitHub-hosted
      # runners have random egress IPs, so allow this run's IP on both and remove
      # both afterwards.
      - name: Allow runner IP through storage and SQL firewalls
        id: fw
        run: |
          set -euo pipefail
          IP=$(curl -fsS https://api.ipify.org)
          echo "runner_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "runner egress IP: $IP"

          # The rule name is derived from the IP so the cleanup step can always
          # find it, even when creation only half succeeded.
          SQL_RULE="github-actions-$IP"
          echo "sql_rule=$SQL_RULE" >> "$GITHUB_OUTPUT"

          # Propagation of a network rule is eventually consistent and the
          # control-plane call itself occasionally 5xxs; retry both.
          for attempt in 1 2 3 4 5; do
            if az storage account network-rule add \
                 --account-name "$STORAGE_ACCOUNT" \
                 --resource-group "$STORAGE_RG" \
                 --ip-address "$IP" -o none 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "could not add firewall rule after 5 attempts" >&2
              exit 1
            fi
            echo "network-rule add failed (attempt $attempt/5), retrying in 15s"
            sleep 15
          done

          # Confirm the rule actually landed instead of trusting the exit code.
          # `-n` here, not `--account-name`: the management-plane command dropped
          # the longer alias in Azure CLI 2.91 and rejects it.
          for attempt in 1 2 3 4 5; do
            if az storage account show \
                 -n "$STORAGE_ACCOUNT" \
                 --resource-group "$STORAGE_RG" \
                 --query "networkRuleSet.ipRules[].ipAddressOrRange" -o tsv \
                 | tr -d '\r' | grep -qx "$IP"; then
              echo "firewall rule for $IP is present"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "firewall rule for $IP never appeared" >&2
              exit 1
            fi
            sleep 10
          done

          # Same for the SQL server. Errors such as "rule already exists" are
          # harmless: the verification below is what decides.
          for attempt in 1 2 3 4 5; do
            az sql server firewall-rule create \
              --resource-group "$STORAGE_RG" \
              --server "$SQL_SERVER" \
              --name "$SQL_RULE" \
              --start-ip-address "$IP" \
              --end-ip-address "$IP" -o none 2>/dev/null || true
            if az sql server firewall-rule show \
                 --resource-group "$STORAGE_RG" \
                 --server "$SQL_SERVER" \
                 --name "$SQL_RULE" \
                 --query "startIpAddress" -o tsv 2>/dev/null | tr -d '\r' | grep -qx "$IP"; then
              echo "SQL firewall rule for $IP is present"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "SQL firewall rule for $IP never appeared" >&2
              exit 1
            fi
            echo "SQL firewall rule not visible yet (attempt $attempt/5)"
            sleep 10
          done

          # Rule present is not the same as reachable: wait for it to take effect.
          for i in $(seq 1 30); do
            if az storage container show --name landing \
                 --account-name "$STORAGE_ACCOUNT" \
                 --auth-mode login -o none 2>/dev/null; then
              echo "storage reachable after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "storage still unreachable after 300s" >&2
          exit 1

      - name: Run ingestion
        env:
          AZURE_STORAGE_ACCOUNT_URL: https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net
        run: python ingest.py

      # Landing -> Azure SQL. Idempotent per (year, gas): a re-run replaces the
      # year's rows rather than appending.
      - name: Load warehouse (landing JSON -> Azure SQL)
        env:
          AZURE_STORAGE_ACCOUNT_URL: https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net
          AZURE_SQL_SERVER: ${{ env.SQL_SERVER }}.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
        run: python warehouse.py load

      # Azure SQL -> Parquet in the `curated` container, because Databricks Free
      # Edition compute cannot reach SQL over the internet. `--out` also stages
      # the same bytes locally for the push step below.
      - name: Export for Databricks (Azure SQL -> Parquet)
        env:
          AZURE_STORAGE_ACCOUNT_URL: https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net
          AZURE_SQL_SERVER: ${{ env.SQL_SERVER }}.database.windows.net
          AZURE_SQL_DATABASE: ${{ env.SQL_DATABASE }}
        run: python warehouse.py export --out=dist

      # The reverse direction: Free Edition cannot read the firewalled storage
      # account (no trusted-domain entry, no private networking), so the
      # snapshot is pushed into a Unity Catalog volume and the table is rebuilt
      # there. Skipped until the DATABRICKS_* secrets exist, so the Azure half
      # keeps running without a workspace.
      - name: Push to Databricks (Parquet -> Unity Catalog)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_VOLUME: ${{ vars.DATABRICKS_VOLUME }}
          DATABRICKS_TABLE: ${{ vars.DATABRICKS_TABLE }}
        if: env.DATABRICKS_HOST != ''
        run: python databricks_push.py --from=dist

      - name: Remove runner IP from storage and SQL firewalls
        if: always() && steps.fw.outputs.runner_ip != ''
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            if az storage account network-rule remove \
                 --account-name "$STORAGE_ACCOUNT" \
                 --resource-group "$STORAGE_RG" \
                 --ip-address "${{ steps.fw.outputs.runner_ip }}" \
                 -o none --only-show-errors 2>/dev/null; then
              echo "storage firewall rule removed"
              break
            fi
            echo "network-rule remove failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done

          # A rule that was never created is already in the desired state, so
          # check for it instead of treating the delete error as a failure.
          if az sql server firewall-rule show \
               --resource-group "$STORAGE_RG" \
               --server "$SQL_SERVER" \
               --name "${{ steps.fw.outputs.sql_rule }}" -o none 2>/dev/null; then
            for attempt in 1 2 3; do
              if az sql server firewall-rule delete \
                   --resource-group "$STORAGE_RG" \
                   --server "$SQL_SERVER" \
                   --name "${{ steps.fw.outputs.sql_rule }}" \
                   -o none --only-show-errors; then
                echo "SQL firewall rule removed"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::warning::could not remove SQL firewall rule '${{ steps.fw.outputs.sql_rule }}'"
                break
              fi
              echo "SQL rule delete failed (attempt $attempt/3), retrying in 10s"
              sleep 10
            done
          else
            echo "no SQL firewall rule to remove"
          fi

          # Leftover rules are reported, not fatal - the data path already
          # finished by this point and a red run here would be misleading.
          if az storage account show \
               -n "$STORAGE_ACCOUNT" \
               --resource-group "$STORAGE_RG" \
               --query "networkRuleSet.ipRules[].ipAddressOrRange" -o tsv \
               | tr -d '\r' | grep -qx "${{ steps.fw.outputs.runner_ip }}"; then
            echo "::warning::storage firewall still allows ${{ steps.fw.outputs.runner_ip }}; prune it by hand"
          fi
